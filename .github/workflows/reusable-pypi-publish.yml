# This workflow is managed by gh actions-lock.

name: PyPI Publish

on:
  workflow_call:
    inputs:
      version:        { required: true,  type: string }
      repository-url: { required: true,  type: string }
      install-url:    { required: true,  type: string }
      environment-name: { required: true,  type: string }
    secrets:
      PYPI_API_TOKEN: { required: true }

env:
  PACKAGE_NAME: tftp_router_flasher

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: $/.github/actions/setup-python
        with:
          python-version: '3.11'
          requirements: '.[build]'

      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --repository-url "${{ inputs.repository-url }}" dist/* --verbose

      - name: Verify installation
        run: pip install --index-url "${{ inputs.install-url }}" "${PACKAGE_NAME}"
